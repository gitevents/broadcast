name: Create Mailchimp Campaign for Event

permissions:
  issues: write

on:
  workflow_call:
    inputs:
      list-id:
        required: true
        type: string
        description: 'Mailchimp audience/list ID'
      talks-repo:
        required: false
        type: string
    secrets:
      MAILCHIMP_API_KEY:
        required: true
      GH_PAT:
        required: false

jobs:
  broadcast-mailchimp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: gitevents/broadcast

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Deprecation warning
        run: |
          echo "⚠️  WARNING: This workflow is deprecated and will be removed in v2.0.0"
          echo "📖 Please migrate to the unified broadcast workflow:"
          echo "   uses: gitevents/broadcast/.github/workflows/broadcast.yml@v1"
          echo "🔗 Migration guide: https://github.com/gitevents/broadcast#migration-guide"

      - name: Detect lifecycle
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const { detectLifecycle } = require('./dist/lifecycle.js')
            const lifecycle = detectLifecycle(context)
            core.setOutput('type', lifecycle.type)

      - name: Fetch and transform data
        if: steps.lifecycle.outputs.type != 'none'
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const { fetchEventData } = require('./dist/fetcher.js')
            const { transformForMailchimp } = require('./dist/transformer.js')
            const eventData = await fetchEventData(context, { talksRepo: '' })
            const payload = await transformForMailchimp(eventData)
            core.setOutput('payload', JSON.stringify(payload))

      - name: Create Mailchimp campaign (placeholder)
        if: steps.lifecycle.outputs.type != 'none'
        run: echo "Mailchimp provider placeholder - not yet implemented"

      - name: Comment on issue
        if: always() && steps.lifecycle.outputs.type != 'none'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Mailchimp provider not yet implemented'
            })
