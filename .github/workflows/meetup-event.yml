name: Create Events on Meetup

permissions:
  issues: write

on:
  workflow_call:
    inputs:
      group-urlname:
        required: true
        type: string
        description: 'Meetup group URL name'
      talks-repo:
        required: false
        type: string
    secrets:
      MEETUP_EMAIL:
        required: true
      MEETUP_PASSWORD:
        required: true
      GH_PAT:
        required: false

jobs:
  broadcast-meetup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: gitevents/broadcast

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Detect lifecycle
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const { detectLifecycle } = require('./dist/lifecycle.js')
            const lifecycle = detectLifecycle(context)
            core.setOutput('type', lifecycle.type)

      - name: Fetch and transform data
        if: steps.lifecycle.outputs.type != 'none'
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const { fetchEventData } = require('./dist/fetcher.js')
            const { transformForMeetup } = require('./dist/transformer.js')
            const eventData = await fetchEventData(context, { talksRepo: '' })
            const payload = await transformForMeetup(eventData)
            core.setOutput('payload', JSON.stringify(payload))

      - name: Submit to Meetup (placeholder)
        if: steps.lifecycle.outputs.type != 'none'
        run: echo "Meetup provider placeholder - not yet implemented"

      - name: Comment on issue
        if: always() && steps.lifecycle.outputs.type != 'none'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Meetup provider not yet implemented'
            })
