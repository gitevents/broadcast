name: Create Events on Discord

permissions:
  id-token: write
  issues: write

on:
  workflow_call:
    inputs:
      server-id:
        required: true
        type: string
      time-zone:
        required: true
        type: string
      talks-repo:
        required: false
        type: string
        description: 'Talks repository (owner/repo) for cross-repo fetching'
    secrets:
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_PAT:
        required: false

jobs:
  broadcast-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broadcast repo
        uses: actions/checkout@v4
        with:
          repository: gitevents/broadcast

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Detect lifecycle
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const { detectLifecycle } = require('./dist/lifecycle.js')
            const lifecycle = detectLifecycle(context)
            core.setOutput('type', lifecycle.type)
            core.setOutput('reason', lifecycle.reason)
            core.info(`Lifecycle: ${lifecycle.type} - ${lifecycle.reason}`)

      - name: Fetch event data
        if: steps.lifecycle.outputs.type != 'none'
        id: fetch
        uses: actions/github-script@v7
        env:
          TALKS_REPO: ${{ inputs.talks-repo }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
        with:
          script: |
            const { fetchEventData } = require('./dist/fetcher.js')
            const eventData = await fetchEventData(context, {
              talksRepo: process.env.TALKS_REPO || '',
              enrichSpeakers: false
            })
            core.setOutput('event-data', JSON.stringify(eventData))

      - name: Transform for Discord
        if: steps.lifecycle.outputs.type != 'none'
        id: transform
        uses: actions/github-script@v7
        env:
          EVENT_DATA: ${{ steps.fetch.outputs.event-data }}
          TIME_ZONE: ${{ inputs.time-zone }}
        with:
          script: |
            const { transformForDiscord } = require('./dist/transformer.js')
            const eventData = JSON.parse(process.env.EVENT_DATA)
            const payload = await transformForDiscord(eventData, process.env.TIME_ZONE)
            core.setOutput('payload', JSON.stringify(payload))

      - name: Dispatch to Discord worker
        if: steps.lifecycle.outputs.type != 'none'
        id: dispatch
        uses: actions/github-script@v7
        env:
          SERVER_ID: ${{ inputs.server-id }}
          LIFECYCLE: ${{ steps.lifecycle.outputs.type }}
          PAYLOAD: ${{ steps.transform.outputs.payload }}
        with:
          script: |
            const httpm = require('@actions/http-client')
            const http = new httpm.HttpClient()

            const idToken = await core.getIDToken()
            await http.postJson('https://discord.gitevents.workers.dev/', {
              lifecycle: process.env.LIFECYCLE,
              serverId: process.env.SERVER_ID,
              payload: JSON.parse(process.env.PAYLOAD)
            }, {
              Accept: 'application/json',
              'Content-Type': 'application/json',
              Authorization: idToken
            })

      - name: Comment on issue
        if: always() && steps.lifecycle.outputs.type != 'none'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.dispatch.outcome }}'
            const lifecycle = '${{ steps.lifecycle.outputs.type }}'
            const emoji = outcome === 'success' ? '✅' : '❌'
            const action = lifecycle === 'create' ? 'created' : lifecycle === 'update' ? 'updated' : 'cancelled'

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} Event ${action} on Discord`
            })

      - name: Add Event Created label
        if: success() && steps.lifecycle.outputs.type == 'create'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['Event Created ✓']
            })
